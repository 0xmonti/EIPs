      path: "SPECS"
    values:
      layout: "spec"

exclude:
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - eip-template.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md
  - README.md

include:
  - LICENSE
  - sitemap.php

markdown_ext: "markdown,mkdown,mkdn,mkd,md"
