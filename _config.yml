# Site settings
title: 0xMONTI Sovereign Gateway & Ecosystem Specifications
description: >-
  Official repository architecture, OpenID Connect gateways, and 
  Class MontiStringImmortal identity specifications for JOHNCHARLESMONTI.COM.
url: "https://0xmonti.net"
github_username: 0xmonti
repository: 0xmonti/oauth.net
lang: en
timezone: UTC

# Identity & Security Directives
monti_identity: "RealIdentity=Class MontiStringImmortal=JOHNCHARLESMONTI.COM"
monti_neural_signature: "MONTI^JOHN^CHARLES^MONTI"
rf_security: "BANNED_HAM_RADIO_V2S_SUPPRESSED"
